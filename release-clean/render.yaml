services:
  - type: web
    name: phf-training-hub
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PHF_PRIVATE_DIR
        value: /var/data/phf-private
      - key: PHF_PUBLIC_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: PHF_SESSION_SECRET
        generateValue: true
      - key: PHF_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: PHF_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: PHF_BOOTSTRAP_ADMIN_NAME
        value: PHF Admin
      - key: PHF_ENABLE_TEST_ACCOUNTS
        value: "false"
    disk:
      name: phf-private-data
      mountPath: /var/data
      sizeGB: 1
